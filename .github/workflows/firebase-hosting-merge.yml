name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - development
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm config set legacy-peer-deps true
      - run: npm ci && npm run build -- --configuration development
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARNABPORTFOLIO_80E5E }}'
          channelId: live
          projectId: arnabportfolio-80e5e
